# Reverse proxy + basic auth in front of the Streamlit dashboard, running as its own container
# (deliberately NOT the system nginx already on this box, which belongs to another, unrelated
# project on port 80). Proxies to the `dashboard` service by its Docker Compose network name.
server {
    listen 80;
    server_name _;

    auth_basic "cspm-llm-remediation";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://dashboard:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit needs WebSocket upgrade support for its live UI connection.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
