# Deployment for the existing devops-instance (shared box, 2 vCPU / ~2.8GB available RAM).
#
# Public access: an `nginx-proxy` container puts HTTP basic auth in front of the dashboard on
# port 8080 — deliberately its own container on its own port, not the system nginx already on
# this box (that one owns port 80 for a different, unrelated project and is left untouched). The
# security group already allows 0.0.0.0/0, so this is reachable at
# http://<instance public IP>:8080/ once credentials are entered. The dashboard container
# itself stays bound to 127.0.0.1:8501 — only reachable
# through the authenticated proxy, or via an SSM port-forwarding session for direct debugging:
#   aws ssm start-session --region us-west-2 --target i-08f298083f7ad69e1 \
#     --document-name AWS-StartPortForwardingSession \
#     --parameters '{"portNumber":["8501"],"localPortNumber":["8501"]}'
#
# No standalone MLflow server container: the FastAPI-based mlflow 3.x server's baseline memory
# footprint (1.2GB+ even pinned to one worker) is too heavy for this shared box, which also
# runs MongoDB, xrdp and other users' work. MLFLOW_TRACKING_URI in .env instead points straight
# at a SQLite file (./mlruns/mlflow.db, bind-mounted below) — the dashboard and classifier read
# and write it directly through the mlflow Python client, no server process required. To browse
# the MLflow UI, run it on demand: `docker compose run --rm -p 127.0.0.1:5000:5000 dashboard
# mlflow server --backend-store-uri sqlite:////app/mlruns/mlflow.db --host 0.0.0.0` and stop it
# when done.

services:
  dashboard:
    build: .
    image: cspm-llm-remediation:latest
    command: >
      streamlit run dashboard/app.py
      --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./terraform_plugin_cache:/app/.terraform-plugin-cache
    env_file:
      - .env
    environment:
      # Every validation run gets a fresh tempdir (rag_pipeline/validator.py), so without this
      # `terraform init` re-downloads the AWS provider from the registry over the network on
      # every single generation. This persists the download across runs (and across container
      # rebuilds, since it's bind-mounted) so init only pulls the provider once.
      - TF_PLUGIN_CACHE_DIR=/app/.terraform-plugin-cache
    # Measured baseline usage at idle (13K-finding real dataset + XGBoost + Streamlit) was
    # 747MiB/1GiB -- 73% with zero headroom, which is consistent with the intermittent long
    # hangs/timeouts seen in terraform validate's provider-schema subprocess under contention.
    # Raised with real slack in mind; this box (3.8GB total) also runs minikube (~700MB) and
    # other tenants' work, so this isn't raised to the host's full ceiling.
    mem_limit: 1536m
    restart: unless-stopped

  nginx-proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - dashboard
    mem_limit: 64m
    restart: unless-stopped
